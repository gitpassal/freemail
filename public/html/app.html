  <div class="container">

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <use href="/icons/sprites.svg#icon-inbox"/>

        <div class="sidebar-header-actions">
          <span id="quota" class="quota-display"></span>
          <button id="sidebar-toggle" class="sidebar-toggle-btn" title="收起侧板" aria-label="收起侧边栏" data-i18n-title="app.collapseSidebar" data-i18n-aria="app.collapseSidebarAria">

              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

              </svg>

          <button id="mb-toggle" class="sidebar-toggle-btn" title="展开/收起历史邮箱" aria-label="展开或收起历史邮箱列表" data-i18n-title="app.toggleHistory" data-i18n-aria="app.toggleHistoryAria">
            <span id="mb-toggle-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

      </div>
      <div class="sidebar-search">
        <input id="mb-search" class="input sidebar-search-input" placeholder="搜索历史邮箱" aria-label="搜索历史邮箱" data-i18n-ph="app.searchHistory" data-i18n-aria="app.searchHistory" />
      </div>
      <div id="mb-list"></div>
      <div id="mb-loading" style="margin-top:12px"></div>
      <div id="mb-pager" class="pager" style="display:none;margin-top:16px">
        <button id="mb-prev" class="btn btn-ghost btn-sm" data-i18n="common.prev">上一页</button>

      </div>

    <div class="main">
      <div class="card generate-card">
        <h2>
          <span class="card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <use href="/icons/sprites.svg#icon-sparkles"/>
            </svg>
          </span>
          <span data-i18n="app.generateTitle">生成临时邮箱</span>
        </h2>

        <div class="mailbox-layout">
          <!-- 左侧：邮箱地址展示 -->
          <div class="mailbox-display-section">
            <div class="mailbox-display-content">
              <div class="section-header">
                <span class="section-icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <use href="/icons/sprites.svg#icon-mail"/>
                  </svg>
                </span>
                <span class="section-title" data-i18n="app.currentMailbox">当前邮箱</span>
              </div>
              <div id="email" class="email-display">
                <span id="email-text" class="email-text"><span class="placeholder-text" data-i18n="app.placeholderGen">点击右侧生成按钮创建邮箱地址</span></span>
                <div id="custom-overlay" class="custom-overlay" style="display:none">
                  <input id="custom-local-overlay" class="input custom-input" type="text" placeholder="Enter prefix, e.g. giffgaff" aria-label="自定义邮箱用户名" data-i18n-ph="app.prefixPh" data-i18n-aria="app.usernamePh" />
                  <label class="custom-cf-toggle" title="自动追加随机 Suffix" data-i18n-title="app.addSuffixTitle">
                    <input id="custom-cf-suffix-overlay" type="checkbox" checked />
                    <span data-i18n="app.addSuffix">Add Suffix</span>
                  </label>
                  <button id="create-custom-overlay" class="btn btn-primary btn-sm" data-i18n="app.create">创建</button>
                </div>
              </div>
            </div>
            <div class="mailbox-actions" id="email-actions" style="display:none">
              <button id="copy" class="btn btn-secondary" style="width:100%" aria-label="复制邮箱地址" data-i18n-aria="app.copyMailboxAria">
                <span class="btn-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <use href="/icons/sprites.svg#icon-copy"/>
                  </svg>
                </span>
                <span data-i18n="app.copyMailbox">复制邮箱</span>
              </button>
              <button id="compose" class="btn btn-primary" style="width:100%" aria-label="发邮件" data-i18n-aria="app.sendMail">
                <span class="btn-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <use href="/icons/sprites.svg#icon-send"/>
                  </svg>
                </span>
                <span data-i18n="app.sendMail">发邮件</span>
              </button>
              <button id="clear" class="btn btn-danger" style="width:100%" aria-label="清空邮件" data-i18n-aria="app.clearMail">
                <span class="btn-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <use href="/icons/sprites.svg#icon-trash"/>
                  </svg>
                </span>
                <span data-i18n="app.clearMail">清空邮件</span>
              </button>
              <button id="refresh" class="btn btn-ghost" style="width:100%" aria-label="刷新邮件" data-i18n-aria="app.refreshMail">
                <span class="btn-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <use href="/icons/sprites.svg#icon-refresh"/>
                  </svg>
                </span>
                <span data-i18n="app.refreshMail">刷新邮件</span>
              </button>
              <button id="forward-setting" class="btn btn-ghost" style="width:100%" aria-label="转发设置" data-i18n-aria="app.forwardSettings">
                <span class="btn-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <use href="/icons/sprites.svg#icon-forward"/>
                  </svg>
                </span>
                <span data-i18n="app.forwardSettings">转发设置</span>
              </button>
              <button id="toggle-favorite" class="btn btn-ghost" style="width:100%" aria-label="收藏邮箱" data-i18n-aria="app.favorite">
                <span class="btn-icon" id="favorite-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <use href="/icons/sprites.svg#icon-star-empty"/>
                  </svg>
                </span>
                <span id="favorite-text" data-i18n="app.favorite">收藏邮箱</span>
              </button>
            </div>
          </div>

          <!-- 右侧：邮箱配置 -->
          <div class="mailbox-config-section">
            <div class="section-header">
              <span class="section-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <use href="/icons/sprites.svg#icon-settings"/>
                </svg>
              </span>
              <span class="section-title" data-i18n="app.config">邮箱配置</span>
              <button id="config-toggle" class="sidebar-toggle-btn" title="展开/收起配置" aria-label="展开或收起配置面板" data-i18n-title="app.toggleConfig" data-i18n-aria="app.toggleConfigAria">
                <span id="config-toggle-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <use href="/icons/sprites.svg#icon-chevron-down"/>
                  </svg>
                </span>
              </button>
            </div>
            <div class="config-form">
              <div class="config-item">
                <label class="config-label" for="domain-select">
                  <span class="label-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <use href="/icons/sprites.svg#icon-globe"/>
                    </svg>
                  </span>
                  <span data-i18n="app.domain">邮箱后缀</span>
                </label>
                <select id="domain-select" class="select config-select" aria-label="选择邮箱后缀域名" data-i18n-aria="app.domainAria"></select>
              </div>
              <div class="config-item">
                <label class="config-label" for="len-range">
                  <span class="label-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <use href="/icons/sprites.svg#icon-ruler"/>
                    </svg>
                  </span>
                  <span data-i18n="app.length">用户名长度</span>
                </label>
                <div class="range-container">
                  <input id="len-range" class="range" type="range" min="8" max="30" step="1" value="8" aria-label="设置用户名长度" data-i18n-aria="app.lengthAria" />
                  <div class="range-display">
                    <span id="len-val" class="len-value">8</span>
                    <span class="len-unit" data-i18n="app.unit">位</span>
                  </div>
                </div>
              </div>
               <div class="generate-action">
                 <div class="generate-buttons" style="display: flex; gap: 8px; margin-bottom: 8px; width: 100%;">
                   <button id="gen" class="btn btn-generate" style="flex: 1;" aria-label="随机生成邮箱" data-i18n-aria="app.randomGenAria">
                     <span class="btn-icon">
                       <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                         <use href="/icons/sprites.svg#icon-dice"/>
                       </svg>
                     </span>
                     <span data-i18n="app.randomGen">随机生成</span>
                   </button>
                   <button id="gen-name" class="btn btn-primary" style="flex: 1;" title="使用随机人名生成邮箱" aria-label="使用随机人名生成邮箱" data-i18n-title="app.randomNameTitle" data-i18n-aria="app.randomNameTitle">
                     <span class="btn-icon">
                       <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                         <use href="/icons/sprites.svg#icon-user"/>
                       </svg>
                     </span>
                     <span data-i18n="app.randomName">随机人名</span>
                   </button>
                 </div>
                 <button id="toggle-custom" class="btn btn-secondary btn-sm" style="width: 100%;" title="自定义邮箱" aria-label="切换到自定义邮箱模式" data-i18n-title="app.toggleCustomTitle" data-i18n-aria="app.toggleCustomAria" data-i18n="app.toggleCustom">切换自定义</button>
               </div>
            </div>
          </div>
        </div>
      </div>
      <div class="card inbox-card" id="list-card" style="display:none">
        <div class="listcard-header">
          <h2 class="listcard-title">
            <span class="card-icon" id="box-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <use href="/icons/sprites.svg#icon-inbox"/>
              </svg>
            </span>
            <span id="box-title" data-i18n="app.boxInbox">收件箱</span>
          </h2>
          <div class="view-switch">
            <button id="tab-inbox" class="seg-btn" aria-pressed="true" data-i18n="app.boxInbox">收件箱</button>
            <button id="tab-sent" class="seg-btn" aria-pressed="false" data-i18n="app.boxSent">发件箱</button>
          </div>
          <div id="list-status" class="loading-indicator" style="pointer-events:none" role="status" aria-live="polite">
            <div id="list-spinner" class="spinner"></div>
            <span id="list-status-text" data-i18n="common.loading">加载中…</span>
          </div>
        </div>
        <div class="list-viewport" style="position:relative;contain:layout paint;isolation:isolate;">
          <div id="list" class="list"></div>
          <div id="list-pager" class="pager" style="display:none">
            <button id="prev-page" class="btn btn-ghost btn-sm" data-i18n="common.prev">上一页</button>
            <span id="page-info" class="muted" style="min-width:100px;text-align:center"></span>
            <button id="next-page" class="btn btn-ghost btn-sm" data-i18n="common.next">下一页</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-slot"></div>

  <div class="modal" id="email-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div id="modal-subject">
          <span class="modal-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <use href="/icons/sprites.svg#icon-mail"/>
            </svg>
          </span>
          <span data-i18n="mail.detail">邮件详情</span>
        </div>
        <button id="modal-close" class="close" aria-label="关闭" data-i18n-aria="common.close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <use href="/icons/sprites.svg#icon-x"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="modal-content"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="confirm-modal">
    <div class="modal-card confirm-card">
      <div class="modal-header confirm-header">
        <div>
          <span class="modal-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <use href="/icons/sprites.svg#icon-alert"/>
            </svg>
          </span>
          <span data-i18n="common.confirmAction">确认操作</span>
        </div>
        <button id="confirm-close" class="close" aria-label="关闭" data-i18n-aria="common.close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <use href="/icons/sprites.svg#icon-x"/>
          </svg>
        </button>
      </div>
      <div class="modal-body confirm-body">
        <div id="confirm-message" class="confirm-message"></div>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="btn btn-secondary" data-i18n="common.cancel">取消</button>
          <button id="confirm-ok" class="btn btn-danger" data-i18n="common.confirm">确定</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="compose-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <span class="modal-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <use href="/icons/sprites.svg#icon-send"/>
            </svg>
          </span>
          <span data-i18n="compose.title">新邮件</span>
        </div>
        <button id="compose-close" class="close" aria-label="关闭" data-i18n-aria="common.close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <use href="/icons/sprites.svg#icon-x"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="compose-form">
          <div class="field-group">
            <label class="field-label" for="compose-to" data-i18n="compose.to">收件人</label>
            <input id="compose-to" class="input field-input" type="text" placeholder="foo@example.com, bar@example.com" aria-describedby="compose-to-hint" />
            <div id="compose-to-hint" class="field-hint" data-i18n="compose.toHint">多个地址请以逗号分隔</div>
          </div>
          <div class="field-group">
            <label class="field-label" for="compose-from-name" data-i18n="compose.fromName">发件名称（可选）</label>
            <input id="compose-from-name" class="input field-input" type="text" placeholder="例如：iDing 支持团队" data-i18n-ph="compose.fromNamePh" />
          </div>
          <div class="field-group">
            <label class="field-label" for="compose-subject" data-i18n="compose.subject">主题</label>
            <input id="compose-subject" class="input field-input" type="text" placeholder="主题" data-i18n-ph="compose.subjectPh" />
          </div>
          <div class="field-group">
            <label class="field-label" for="compose-body" data-i18n="compose.body">内容</label>
            <textarea id="compose-body" class="textarea field-textarea" rows="10" placeholder="请输入邮件内容" data-i18n-ph="compose.bodyPh"></textarea>
          </div>
          <div class="compose-actions">
            <button id="compose-cancel" class="btn btn-secondary" data-i18n="common.cancel">取消</button>
            <button id="compose-send" class="btn btn-primary" data-i18n="compose.send">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>
