<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>加载中 - Cloudflare Alias</title>
    <meta name="application-name" content="Cloudflare Alias" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cloudflare Alias" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/pwa.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <!-- 主题切换支持 -->
    <script src="/js/pwa.js" defer></script>
    <script src="/js/theme-toggle.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: var(--font-sans);
        background: var(--bg);
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        color: var(--text); position: relative; overflow-x: hidden;
      }
      footer{ position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: var(--text-muted); font-size: 12px; pointer-events: none; }
      .loading-container { text-align: center; padding: 2rem 2.5rem; background: var(--card); border-radius: var(--radius-card); border: 1px solid var(--separator); box-shadow: var(--shadow-md); position: relative; z-index: 1; }
      .logo { margin-bottom: 1rem; color: var(--accent); }
      .title { font-size: 1.25rem; margin-bottom: 1rem; font-weight: 600; color: var(--text); }
      .spinner { width: 36px; height: 36px; border: 3px solid var(--separator); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 1rem; }
      .status { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.75rem; font-weight: 500; }
      .progress { width: 200px; height: 4px; background: var(--accent-tint); border-radius: 2px; margin: 0 auto; overflow: hidden; }
      .progress-bar { height: 100%; background: var(--accent); border-radius: 2px; animation: progress 1.6s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg);} }
      @keyframes progress { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
    </style>
  </head>
  <body>
    <div class="loading-container">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <use href="/icons/sprites.svg#icon-mail"/>
        </svg>
      </div>
      <h1 class="title">临时邮箱</h1>
      <div class="spinner"></div>
      <div class="status">请稍候...</div>
      <div class="progress"><div class="progress-bar"></div></div>
    </div>
    <div id="footer-slot"></div>
    <script src="/js/auth-guard.js" data-autorun="loading"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // 根据 URL 查询参数自定义状态文案：?status=...
        try {
          const u = new URL(location.href);
          const s = (u.searchParams.get('status') || '').trim();
          if (s) {
            const el = document.querySelector('.status');
            if (el) el.textContent = s;
          }
        } catch(_){ }
        (async function(){
          try{
            const res = await fetch('/templates/footer.html', { cache: 'no-cache' });
            const html = await res.text();
            const slot = document.getElementById('footer-slot');
            if (slot){ slot.outerHTML = html; setTimeout(()=>{ const y=document.getElementById('footer-year'); if (y) y.textContent = new Date().getFullYear(); },0); }
          }catch(_){ }
        })();
        // 预加载首页关键资源（模板和脚本），认证后可无缝切换
        try{ fetch('/templates/app.html', { cache: 'force-cache' }); }catch(_){ }
        try{
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'script';
          link.href = '/js/app.js';
          document.head.appendChild(link);
        }catch(_){ }
        // 已认证用户兜底重定向：检测 Cookie 则确保跳往目标（更短延时）
        try{
          var hasToken = document.cookie.split(';').some(function(c){ return c.trim().indexOf('iding-session=') === 0; });
          if (hasToken){
            var target = (function(){ try{ var u=new URL(location.href); return u.searchParams.get('redirect')||'/'; }catch(_){ return '/'; }})();
            // 减少延时时间
            setTimeout(function(){ try{ location.replace(target); }catch(_){ location.replace('/'); } }, 100);
          }
        }catch(_){ }
      });
    </script>
  </body>
</html>
